name: Rename uploaded file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git config user.name "erpan219"
          git config user.email "erpan219@users.noreply.github.com"
          git mv virginia-grades-6-8-learning-site.html index.html
          git commit -m "Rename virginia-grades-6-8-learning-site.html to index.html"
          git push
