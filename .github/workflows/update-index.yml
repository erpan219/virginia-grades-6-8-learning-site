name: Update index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download new index.html
        run: curl -L -o index.html "https://muse.ai/files/1219155904625602/4646935582248999/lirewjj2h6cbfrfov2o9rmq6/virginia-grades-6-8-learning-site.html"
      - name: Commit and push
        run: |
          git config user.name "erpan219"
          git config user.email "erpan219@users.noreply.github.com"
          git add index.html
          git commit -m "Make subject banners work as filters" || echo "nothing to commit"
          git push
