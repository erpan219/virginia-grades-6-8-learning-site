name: Restore index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download fixed index.html
        run: curl -L -o index.html "https://muse.ai/files/1219155904625602/5400204786871849/di5jeab6184oo8m3t1e5irrw/virginia-grades-6-8-learning-site.html"
      - name: Commit and push
        run: |
          git config user.name "erpan219"
          git config user.email "erpan219@users.noreply.github.com"
          git add index.html
          git commit -m "Restore index.html with lesson-card fix" || echo "nothing to commit"
          git push
